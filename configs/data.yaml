# configs/data.yaml
# All paths are relative to the project root.
# Hydra resolves them correctly regardless of where you run the script from.

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

  # Raw input files (downloaded from Kaggle, tracked by DVC)
  application_train: data/raw/application_train.csv
  application_test:  data/raw/application_test.csv
  bureau:            data/raw/bureau.csv
  bureau_balance:    data/raw/bureau_balance.csv
  previous_app:      data/raw/previous_application.csv
  pos_cash:          data/raw/POS_CASH_balance.csv
  installments:      data/raw/installments_payments.csv
  credit_card:       data/raw/credit_card_balance.csv

  # Interim outputs (validated, typed)
  validated_train:   data/interim/application_train_validated.parquet
  validated_test:    data/interim/application_test_validated.parquet

  # Processed outputs (fully feature-engineered, ready for modelling)
  features_train:    data/processed/features_train.parquet
  features_test:     data/processed/features_test.parquet

processing:
  target_col: TARGET
  id_col: SK_ID_CURR
  test_size: 0.2
  random_seed: 42

  # Missing value strategy
  numeric_impute_strategy: median   # median | mean | zero
  categorical_fill_value: "Unknown"

  # Outlier handling
  winsorize_quantile: 0.99          # cap extreme values at this percentile
