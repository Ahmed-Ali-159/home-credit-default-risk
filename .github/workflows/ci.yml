# .github/workflows/ci.yml
# Runs on every pull request targeting main.
# Must pass before merging is allowed (enforce via branch protection rules).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true          # caches the uv package cache between runs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras     # installs dev deps too (pytest, ruff, etc.)

      - name: Lint with ruff
        run: |
          uv run ruff check src/ api/ tests/
          uv run ruff format --check src/ api/ tests/

      - name: Run tests
        run: uv run pytest --cov=src --cov=api --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false     # don't fail CI if codecov upload fails
