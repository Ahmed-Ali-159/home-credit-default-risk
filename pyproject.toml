[project]
name = "home-credit-default-risk"
version = "0.1.0"
description = "Production-grade credit default risk prediction — Kaggle Home Credit competition"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",          # fast parquet read/write (DVC stages output parquet)

    # Validation
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0", # load config from env vars / .env in production

    # Config management
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",

    # ML
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "optuna>=3.6.0",
    "optuna-integration>=3.6.0", # MLflow callback for Optuna

    # Explainability
    # shap>=0.46.0 uses llvmlite>=0.39.0 which supports Python 3.12
    "shap==0.46.0",

    # Experiment tracking
    "mlflow>=2.11.0",

    # Data versioning
    "dvc>=3.49.0",
    "dvc-s3>=3.2.0",            # optional: swap for dvc-gdrive if preferred

    # Serving
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Monitoring
    "evidently>=0.4.0",

    # Utilities
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # async test client for FastAPI
    "ruff>=0.4.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
    "nbconvert>=7.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
    "nbconvert>=7.16.0",
]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (catches real bugs)
]
ignore = [
    "E501",  # line too long — ruff format handles this
]

[tool.ruff.lint.isort]
known-first-party = ["src", "api"]


# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov=api --cov-report=term-missing --cov-fail-under=70"