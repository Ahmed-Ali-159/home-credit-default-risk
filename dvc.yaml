# dvc.yaml
# Run the full pipeline with:  dvc repro
# Run a single stage with:     dvc repro validate_data
#
# DVC tracks content hashes of deps and outs.
# If nothing changed, the stage is skipped — fast incremental runs.

stages:

  # ── Stage 1: Validate raw data ─────────────────────────────────────────────
  # Reads raw CSVs, runs Pydantic schema validation, writes clean parquets.
  # If this stage fails, it means the data you downloaded is malformed.
  validate_data:
    cmd: python src/data/validate.py
    deps:
      - src/data/validate.py
      - src/data/schemas.py
      - configs/data.yaml
      - data/raw/application_train.csv
      - data/raw/application_test.csv
      - data/raw/bureau.csv
      - data/raw/bureau_balance.csv
      - data/raw/previous_application.csv
      - data/raw/POS_CASH_balance.csv
      - data/raw/installments_payments.csv
      - data/raw/credit_card_balance.csv
    outs:
      - data/interim/application_train_validated.parquet
      - data/interim/application_test_validated.parquet
      - data/interim/bureau_validated.parquet
      - data/interim/bureau_balance_validated.parquet
      - data/interim/previous_app_validated.parquet
      - data/interim/pos_cash_validated.parquet
      - data/interim/installments_validated.parquet
      - data/interim/credit_card_validated.parquet

  # ── Stage 2: Feature engineering ───────────────────────────────────────────
  # Reads validated parquets, builds all feature groups, merges into one
  # wide DataFrame per split, writes processed parquets.
  build_features:
    cmd: python src/features/build.py
    deps:
      - src/features/build.py
      - src/features/application.py
      - src/features/bureau.py
      - src/features/previous_app.py
      - src/features/balances.py
      - configs/data.yaml
      - configs/features.yaml
      - data/interim/application_train_validated.parquet
      - data/interim/application_test_validated.parquet
      - data/interim/bureau_validated.parquet
      - data/interim/bureau_balance_validated.parquet
      - data/interim/previous_app_validated.parquet
      - data/interim/pos_cash_validated.parquet
      - data/interim/installments_validated.parquet
      - data/interim/credit_card_validated.parquet
    outs:
      - data/processed/features_train.parquet
      - data/processed/features_test.parquet
    metrics:
      - data/processed/feature_report.json:   # shape, feature count, null rates
          cache: false

  # ── Stage 3: Train ─────────────────────────────────────────────────────────
  # Reads processed features, runs CV training, logs to MLflow.
  # Outputs the best model artifact and CV metrics.
  train:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - src/models/evaluate.py
      - configs/model.yaml
      - data/processed/features_train.parquet
    outs:
      - models/lgbm_best.pkl:
          cache: true
    metrics:
      - models/cv_metrics.json:
          cache: false

  # ── Stage 4: Generate submission ───────────────────────────────────────────
  predict:
    cmd: python src/models/predict.py
    deps:
      - src/models/predict.py
      - models/lgbm_best.pkl
      - data/processed/features_test.parquet
    outs:
      - data/processed/submission.csv:
          cache: false
