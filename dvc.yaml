# dvc.yaml
# Simplified 3-stage pipeline (no Pydantic validation stage).
# Run full pipeline:  dvc repro
# Run single stage:   dvc repro train

# DVC tracks content hashes of deps and outs.
# If nothing changed, the stage is skipped — fast incremental runs.

stages:

  # ── Stage 1: Feature engineering ──────────────────────────────────────────
  # Reads raw CSVs directly, builds all feature groups, writes processed parquets.
  build_features:
    cmd: python src/features/build.py
    deps:
      - src/features/build.py
      - src/features/application.py
      - src/features/bureau.py
      - src/features/previous_app.py
      - src/features/pos_cash.py
      - src/features/installments.py
      - src/features/credit_card.py
      - src/features/cross_table.py
      - src/data/loader.py
      - configs/data.yaml
      - configs/features.yaml
      - data/raw/application_train.csv
      - data/raw/application_test.csv
      - data/raw/bureau.csv
      - data/raw/bureau_balance.csv
      - data/raw/previous_application.csv
      - data/raw/POS_CASH_balance.csv
      - data/raw/installments_payments.csv
      - data/raw/credit_card_balance.csv
    outs:
      - data/processed/features_train.parquet
      - data/processed/features_test.parquet
    metrics:
      - data/processed/feature_report.json:
          cache: false

  # ── Stage 2: Train ────────────────────────────────────────────────────────
  # Reads processed features, runs CV training, logs to MLflow.
  # Outputs the best model artifact and CV metrics.
  train:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - configs/model.yaml
      - data/processed/features_train.parquet
      - data/processed/features_test.parquet
    outs:
      - models/lgbm_best.pkl
      - models/target_encoders.pkl
      - models/feature_cols.pkl
      - models/shap_explainer.pkl
      - models/oof_predictions.parquet
      - data/processed/submission.csv:
          cache: false
    metrics:
      - models/cv_metrics.json:
          cache: false
